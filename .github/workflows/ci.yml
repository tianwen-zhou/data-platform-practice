name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Check the Airflow DAG compiles
        run: python -m py_compile airflow/dags/daily_transactions.py
      - name: Land sample data
        run: |
          for d in 2026-10-01 2026-10-02 2026-10-03; do
            python -m ingest.load_transactions --date "$d"
          done
      - name: dbt build (run + test + snapshot)
        working-directory: dbt_project
        env:
          LAKE_ROOT: ${{ github.workspace }}/lake
        run: dbt build --profiles-dir .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
